[project]
name = "yolo-jetson"
version = "0.1.0"
description = "YOLO training, ONNX export, and evaluation for Jetson Nano experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipython",
    "matplotlib>=3.5",
    "numpy>=1.23.5,<1.24",
    "onnx>=1.16,<1.17",
    "onnxruntime>=1.20,<2",
    "onnxsim>=0.4.36,<0.5",
    "opencv-python>=4.8,<4.12",
    "pandas>=1.5,<3",
    "pillow>=9",
    "protobuf>=3.20.2,<4.21.3",
    "psutil",
    "pycocotools>=2.0.8,<3",
    "pyyaml>=6",
    "requests>=2.28",
    "scipy>=1.9",
    "seaborn>=0.11",
    "setuptools<81",
    "tensorboard>=2.12,<3",
    "thop",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.64",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
